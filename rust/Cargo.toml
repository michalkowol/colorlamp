[package]
name = "raingel"
version = "0.1.0"
edition = "2024"
description = "TUI and CLI for Raingel Bluetooth LE lamps and LED strips"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
btleplug = { version = "0.13.5", features = ["serde"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = "1.29.0"
